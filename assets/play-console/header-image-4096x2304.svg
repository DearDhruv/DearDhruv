<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 2304" width="4096" height="2304">
  <defs>
    <!-- Background Gradient (Solid 100% Opaque Base) -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="35%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Top & Bottom Ambient Lighting Bands -->
    <linearGradient id="ambientTopBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.16" />
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="80%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#FFD740" />
    </linearGradient>

    <!-- Card Specific Border Gradients -->
    <linearGradient id="vhBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FFD740" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="aiBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#E040FB" />
    </linearGradient>

    <linearGradient id="osBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37D5FF" />
      <stop offset="50%" stop-color="#1468E5" />
      <stop offset="100%" stop-color="#18D77A" />
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="cardGlowShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="heroTextGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7F52FF" flood-opacity="0.25" />
    </filter>
    <filter id="neonPillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.10" />
    </pattern>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- 1. Solid Canvas Background -->
  <rect width="4096" height="2304" fill="url(#headerBg)" />

  <!-- 2. Architectural Blueprint Grid -->
  <rect width="4096" height="2304" fill="url(#gridPattern)" />

  <!-- 3. Ambient Lighting Band (Top Horizon) -->
  <rect x="0" y="0" width="4096" height="800" fill="url(#ambientTopBand)" />

  <!-- 4. Constellation Nodes & Tech Geometry -->
  <g opacity="0.45">
    <circle cx="280" cy="220" r="4" fill="#7F52FF" />
    <circle cx="480" cy="180" r="3" fill="#A855F7" />
    <circle cx="680" cy="300" r="5" fill="#00E5FF" />
    <line x1="280" y1="220" x2="480" y2="180" stroke="#7F52FF" stroke-width="1.5" stroke-dasharray="6 8" />
    <line x1="480" y1="180" x2="680" y2="300" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 8" />

    <circle cx="3816" cy="220" r="4" fill="#00E5FF" />
    <circle cx="3616" cy="180" r="3" fill="#3DDC84" />
    <circle cx="3416" cy="300" r="5" fill="#7F52FF" />
    <line x1="3816" y1="220" x2="3616" y2="180" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 8" />
    <line x1="3616" y1="180" x2="3416" y2="300" stroke="#7F52FF" stroke-width="1.5" stroke-dasharray="6 8" />

    <path d="M 160 260 L 160 160 L 260 160" fill="none" stroke="#475569" stroke-width="3" />
    <path d="M 3936 260 L 3936 160 L 3836 160" fill="none" stroke="#475569" stroke-width="3" />
    <path d="M 160 2044 L 160 2144 L 260 2144" fill="none" stroke="#475569" stroke-width="3" />
    <path d="M 3936 2044 L 3936 2144 L 3836 2144" fill="none" stroke="#475569" stroke-width="3" />
  </g>

  <!-- ======================================================== -->
  <!-- 5. MAIN HERO CENTERPIECE (Safe Zone: x=500..3600, y=360..1000) -->
  <!-- ======================================================== -->
  <g transform="translate(2048, 420)" text-anchor="middle">
    <!-- Eyebrow Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="-420" y="-36" width="840" height="72" rx="36" fill="#111827" stroke="#10B981" stroke-width="2" stroke-opacity="0.6" />
      <circle cx="-360" cy="0" r="10" fill="#10B981" />
      <circle cx="-360" cy="0" r="18" fill="#10B981" opacity="0.3" filter="url(#neonPillGlow)" />
      <text x="-320" y="11" class="font-sans" font-size="28" font-weight="800" fill="#34D399" letter-spacing="3.5" text-anchor="start">LEAD ANDROID ENGINEER · TECH LEAD</text>
    </g>

    <!-- Main Title: DearDhruv -->
    <g transform="translate(0, 160)" filter="url(#heroTextGlow)">
      <text x="0" y="0" class="font-sans" font-size="140" font-weight="900" fill="url(#titleGrad)" letter-spacing="-2">DearDhruv</text>
    </g>

