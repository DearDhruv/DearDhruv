      <text x="0" y="60" class="font-sans" font-size="34" font-weight="400" fill="#94A3B8" letter-spacing="0.5">~15 Years of Platform Craft · Adaptive UI Across Mobile, Foldables &amp; Android TV · GDG Speaker</text>
    </g>
  </g>

