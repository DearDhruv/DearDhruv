    <g transform="translate(0, 260)">
      <rect x="-240" y="-32" width="480" height="64" rx="32" fill="rgba(127, 82, 255, 0.15)" stroke="#7F52FF" stroke-width="2.5" />
      <circle cx="-190" cy="0" r="8" fill="#7F52FF" />
      <text x="0" y="10" class="font-mono" font-size="30" font-weight="700" fill="#C4B5FD" letter-spacing="2">"Android Artist"</text>
      <circle cx="190" cy="0" r="8" fill="#00E5FF" />
    </g>

    <!-- Mission Statement / Subtitle -->
