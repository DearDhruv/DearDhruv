<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Solid 100% Opaque Base) -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="iconVioletGlow" cx="25%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7F52FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="iconCyanGlow" cx="75%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Monogram Gradients -->
    <linearGradient id="d1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="45%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="d2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#3DDC84" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- 1. Solid Canvas Background (100% Opaque, No Transparency) -->
  <rect width="512" height="512" fill="url(#iconBgGrad)" />

  <!-- 2. Ambient Lighting Blooms -->
  <rect width="512" height="512" fill="url(#iconVioletGlow)" />
  <rect width="512" height="512" fill="url(#iconCyanGlow)" />

  <!-- 3. Circular Safe Guide Rings (Coordinates r=236 and r=216) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.45" />

  <!-- Cardinal Accent Nodes -->
  <g opacity="0.65">
    <circle cx="256" cy="40" r="3.5" fill="#00E5FF" />
    <circle cx="256" cy="472" r="3.5" fill="#7F52FF" />
    <circle cx="40" cy="256" r="3.5" fill="#A855F7" />
    <circle cx="472" cy="256" r="3.5" fill="#3DDC84" />
    <circle cx="103" cy="103" r="2.5" fill="#64748b" />
    <circle cx="409" cy="103" r="2.5" fill="#64748b" />
    <circle cx="103" cy="409" r="2.5" fill="#64748b" />
    <circle cx="409" cy="409" r="2.5" fill="#64748b" />
  </g>

  <!-- 4. Central Squircle Container (Shield) -->
  <g filter="url(#iconShadow)">
    <rect x="76" y="76" width="360" height="360" rx="88" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <rect x="78" y="78" width="356" height="356" rx="86" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.85" />
    <rect x="80" y="80" width="352" height="352" rx="84" fill="url(#iconVioletGlow)" opacity="0.35" />
  </g>

  <!-- 5. ICON EMBLEM: Interlocking "DD" Monogram + Android Nodes -->
  <g transform="translate(-9, -6)">
    <!-- First 'D' (Dear) - Left Ribbon (Kotlin Violet) -->
    <g filter="url(#iconShadow)">
      <path d="M 172 168 
               L 230 168 
               C 280 168, 310 196, 310 244 
               C 310 292, 280 320, 230 320 
               L 172 320 
               Z" 
            fill="none" 
            stroke="url(#d1Grad)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      
      <path d="M 172 174 L 226 174 C 268 174, 294 198, 294 244 C 294 290, 268 314, 226 314 L 172 314" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="3" 
            stroke-linecap="round" 
            opacity="0.35" />
    </g>

    <!-- Second 'D' (Dhruv) - Interlocking Right Ribbon (Compose Cyan -> Emerald) -->
    <g filter="url(#iconShadow)">
      <path d="M 234 196 
               L 282 196 
               C 330 196, 358 224, 358 266 
               C 358 308, 330 336, 282 336 
               L 234 336 
               Z" 
            fill="none" 
            stroke="url(#d2Grad)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <path d="M 234 202 L 278 202 C 318 202, 342 226, 342 266 C 342 306, 318 330, 278 330 L 234 330" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="3" 
            stroke-linecap="round" 
            opacity="0.4" />
    </g>

    <!-- Android Artist Antenna Nodes -->
    <g transform="translate(324, 158)" filter="url(#neonGlow)">
      <line x1="0" y1="0" x2="14" y2="-14" stroke="#3DDC84" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="16" cy="-16" r="6" fill="#3DDC84" />
      <circle cx="16" cy="-16" r="2.5" fill="#ffffff" />
    </g>

    <g transform="translate(196, 138)" filter="url(#neonGlow)">
      <line x1="0" y1="0" x2="-14" y2="-14" stroke="#7F52FF" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="-16" cy="-16" r="6" fill="#A855F7" />
      <circle cx="-16" cy="-16" r="2.5" fill="#ffffff" />
    </g>

    <!-- Center Intersection Spark Gem -->
    <g transform="translate(232, 244)" filter="url(#neonGlow)">
      <circle cx="0" cy="0" r="12" fill="#00E5FF" opacity="0.3" />
      <polygon points="0,-8 6,0 0,8 -6,0" fill="url(#sparkGrad)" />
    </g>
  </g>

  <!-- 6. Bottom Brand Text Pill (Secure within circular safe zone & symmetrically centered) -->
  <g transform="translate(256, 386)">
    <rect x="-64" y="-13" width="128" height="26" rx="13" fill="#161e31" stroke="url(#ringGrad)" stroke-width="1.2" />
    <circle cx="-44" cy="0" r="3.5" fill="#3DDC84" />
    <text x="-30" y="3.5" class="font-sans" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5">DEARDHRUV</text>
  </g>
</svg>