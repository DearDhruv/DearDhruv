<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="100%" height="270" style="overflow: hidden;">
  <defs>
    <!-- Ambient Gradients -->
    <radialGradient id="ambientViolet" cx="0%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#7F52FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientEmerald" cx="100%" cy="100%" r="85%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientCyan" cx="60%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="heroTitleGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="heroTitleGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Technology Palette Gradients -->
    <linearGradient id="kotlinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" />
      <stop offset="50%" stop-color="#C711E1" />
      <stop offset="100%" stop-color="#E2442F" />
    </linearGradient>
    <linearGradient id="composeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="tvFocusRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="mobileWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="kmpBridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="50%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="heroCardShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.10" flood-color="#000" />
    </filter>
    <filter id="mobileLayerShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-opacity="0.30" flood-color="#000" />
    </filter>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="heroCardClip">
      <rect x="2" y="2" width="796" height="266" rx="16" />
    </clipPath>
  </defs>

  <style>
    /* Global Styles */
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    /* Light Theme (Default) */
    .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; rx: 16px; }
    .text-status { fill: #059669; font-weight: 700; font-size: 9.5px; letter-spacing: 1.2px; }
    .status-pill-bg { fill: rgba(16, 185, 129, 0.08); stroke: rgba(16, 185, 129, 0.25); stroke-width: 1; }
    .text-title { fill: url(#heroTitleGradLight); font-weight: 800; font-size: 32px; }
    .text-handle { fill: #7F52FF; font-weight: 600; font-size: 10.5px; }
    .text-desc { fill: #4b5563; font-size: 13.5px; }
    .text-desc-sub { fill: #6b7280; font-size: 13px; }
    
    /* Device Mockups Light */
    .tv-frame { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .tv-screen { fill: #0b1120; stroke: #1e293b; stroke-width: 1; }
    .mobile-frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.75; }
    .mobile-screen { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .mobile-sub-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 0.75; }
    .mobile-sub-text { fill: #1e293b; }
    .tech-dots { fill: #94a3b8; opacity: 0.35; }
    
    /* Badges Light */
    .tag-exp-bg { fill: rgba(245, 158, 11, 0.1); stroke: rgba(245, 158, 11, 0.35); stroke-width: 1; }
    .tag-exp-text { fill: #d97706; font-weight: 700; font-size: 11px; }
    .tag-pill-bg { fill: #f3f4f6; stroke: #e5e7eb; stroke-width: 1; }
    .tag-pill-text { fill: #374151; font-weight: 600; font-size: 11px; }

    /* Dark Theme Overrides */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .text-status { fill: #34d399; }
      .status-pill-bg { fill: rgba(52, 211, 153, 0.12); stroke: rgba(52, 211, 153, 0.3); }
      .text-title { fill: url(#heroTitleGradDark); }
      .text-handle { fill: #c4b5fd; }
      .text-desc { fill: #9ca3af; }
      .text-desc-sub { fill: #6b7280; }
      
      .tv-frame { fill: #161b22; stroke: #30363d; }
      .tv-screen { fill: #060913; stroke: #1c2538; }
      .mobile-frame { fill: #1c2128; stroke: #30363d; }
      .mobile-screen { fill: #0d1117; stroke: #21262d; }
      .mobile-sub-card { fill: #161b22; stroke: #30363d; }
      .mobile-sub-text { fill: #f1f5f9; }
      .tech-dots { fill: #475569; opacity: 0.5; }
      
      .tag-exp-bg { fill: rgba(251, 191, 36, 0.12); stroke: rgba(251, 191, 36, 0.35); }
      .tag-exp-text { fill: #fbbf24; }
      .tag-pill-bg { fill: #161b22; stroke: #30363d; }
      .tag-pill-text { fill: #d1d5db; }
    }
  </style>

  <!-- Background Base Card -->
  <rect x="2" y="2" width="796" height="266" rx="16" class="card-bg" filter="url(#heroCardShadow)" />

  <!-- Subtle Ambient Corner Light Gradients (Clipped to Card) -->
  <g clip-path="url(#heroCardClip)">
    <rect x="2" y="2" width="380" height="220" rx="16" fill="url(#ambientViolet)" />
    <rect x="420" y="40" width="378" height="228" rx="16" fill="url(#ambientEmerald)" />
    <circle cx="580" cy="40" r="140" fill="url(#ambientCyan)" />
  </g>

  <!-- Elegant Tech Accent Constellation Dots -->
  <g class="tech-dots">
    <circle cx="48" cy="32" r="1.5" />
    <circle cx="68" cy="32" r="1" />
    <circle cx="48" cy="52" r="1" />
    <circle cx="756" cy="32" r="1.5" />
    <circle cx="736" cy="32" r="1" />
    <circle cx="756" cy="52" r="1" />
    <circle cx="48" cy="240" r="1.5" />
    <circle cx="68" cy="240" r="1" />
    <circle cx="756" cy="240" r="1.5" />
    <circle cx="736" cy="240" r="1" />
  </g>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: Professional Brand & Craft Story              -->
  <!-- ======================================================== -->
  <g transform="translate(38, 0)">
    <!-- Eyebrow Status Pill -->
    <g transform="translate(0, 40)">
      <rect x="0" y="-12" width="280" height="22" rx="11" class="status-pill-bg" />
      <!-- Pulsing Emerald Indicator -->
      <circle cx="12" cy="-1" r="3.5" fill="#10B981" />
      <circle cx="12" cy="-1" r="6" fill="#10B981" opacity="0.3" filter="url(#heroGlow)" />
      <text x="24" y="2.5" class="font-sans text-status">LEAD ANDROID ENGINEER · TECH LEAD</text>
    </g>

    <!-- Main Title & Artist Moniker -->
    <g transform="translate(0, 86)">
      <text x="0" y="0" class="font-sans text-title">Dhruv Patel</text>
      <!-- "Android Artist" Moniker Chip -->
      <g transform="translate(200, -21)">
        <rect x="0" y="0" width="132" height="22" rx="11" fill="rgba(127, 82, 255, 0.12)" stroke="#7F52FF" stroke-width="0.75" />
        <circle cx="11" cy="11" r="2.5" fill="#7F52FF" />
        <text x="71" y="14.5" class="font-mono text-handle" text-anchor="middle">"Android Artist"</text>
      </g>
    </g>

    <!-- Craft & Mission Description with Generous Line-Height -->
    <g transform="translate(0, 118)">
      <text x="0" y="0" class="font-sans text-desc">Architecting fluid multiplatform apps &amp; on-device AI,</text>
      <text x="0" y="22" class="font-sans text-desc">with adaptive UI across Mobile, Foldables &amp; Android TV.</text>
      <text x="0" y="44" class="font-sans text-desc-sub">~15 years of engineering craft, KMP architecture &amp; GDG talks.</text>
    </g>

    <!-- Signature Badges Row (Optimized width 378px, leaves 44px gap to devices) -->
    <g transform="translate(0, 204)">
      <!-- Badge 1: 15 Years Craft -->
      <g>
        <rect x="0" y="-12" width="116" height="25" rx="12.5" class="tag-exp-bg" />
        <text x="58" y="4" class="font-sans tag-exp-text" text-anchor="middle">⚡ ~15 Years Craft</text>
      </g>
      
      <!-- Badge 2: Jetpack Compose & KMP -->
      <g transform="translate(124, 0)">
        <rect x="0" y="-12" width="128" height="25" rx="12.5" class="tag-pill-bg" />
        <text x="64" y="4" class="font-sans tag-pill-text" text-anchor="middle">🎨 Compose &amp; KMP</text>
      </g>
      
      <!-- Badge 3: On-Device AI & TV -->
      <g transform="translate(260, 0)">
        <rect x="0" y="-12" width="126" height="25" rx="12.5" class="tag-pill-bg" />
        <text x="63" y="4" class="font-sans tag-pill-text" text-anchor="middle">🧠 On-Device AI · TV</text>
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT COLUMN: Adaptive Device Ecosystem (TV + Mobile + AI) -->
  <!-- ======================================================== -->
  <g transform="translate(460, 20)">
    <!-- 1. Background Device: Android TV Display (Compose for TV) -->
    <!-- Positioned at x=82 to 306 (width=224), TV contents start at x=96 -->
    <g transform="translate(82, 10)">
      <!-- TV Bezel Frame -->
      <rect x="0" y="0" width="224" height="142" rx="10" class="tv-frame" />
      <!-- TV Screen -->
      <rect x="5" y="5" width="214" height="132" rx="7" class="tv-screen" />
      <!-- TV Stand -->
      <path d="M 96 142 L 128 142 L 124 150 L 100 150 Z" class="tv-frame" opacity="0.8" />
      
      <!-- TV Screen Navigation Bar -->
      <g transform="translate(12, 14)">
        <rect x="0" y="0" width="38" height="9" rx="4.5" fill="#4285F4" opacity="0.9" />
        <text x="19" y="6.8" class="font-sans" font-size="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">FEATURED</text>
        <rect x="44" y="2" width="20" height="5" rx="2.5" fill="#334155" opacity="0.6" />
        <rect x="68" y="2" width="20" height="5" rx="2.5" fill="#334155" opacity="0.6" />
        <text x="192" y="7" class="font-mono" font-size="5" font-weight="600" fill="#64748b" text-anchor="end">4K LEANBACK</text>
      </g>

      <!-- TV Hero Banner Card -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="190" height="38" rx="6" fill="url(#kotlinGrad)" fill-opacity="0.18" stroke="#7F52FF" stroke-width="0.75" />
        <text x="10" y="14" class="font-sans" font-size="8" font-weight="800" fill="#ffffff">Compose for TV</text>
        <text x="10" y="24" class="font-sans" font-size="5.5" fill="#94a3b8">10-foot immersive carousel &amp; focus engine</text>
        <rect x="10" y="27" width="38" height="7" rx="3.5" fill="#3DDC84" />
        <text x="29" y="32.5" class="font-sans" font-size="4.5" font-weight="800" fill="#003314" text-anchor="middle">LAUNCH APP</text>
      </g>

      <!-- TV App Carousel Shelf (All 3 tiles 100% visible) -->
      <g transform="translate(12, 72)">
        <!-- Tile 1: Active Focused App (Open Store) with Neon Focus Ring -->
        <g>
          <rect x="-1" y="-1" width="56" height="46" rx="6" fill="none" stroke="url(#tvFocusRing)" stroke-width="1.5" filter="url(#heroGlow)" />
          <rect x="0" y="0" width="54" height="44" rx="5" fill="#131c31" stroke="url(#tvFocusRing)" stroke-width="1.25" />
          <circle cx="27" cy="16" r="7" fill="#00E5FF" opacity="0.2" />
          <path d="M 23 12 L 32 16 L 23 20 Z" fill="#00E5FF" />
          <text x="27" y="34" class="font-sans" font-size="5.5" font-weight="700" fill="#ffffff" text-anchor="middle">Open Store</text>
        </g>

        <!-- Tile 2: Veloci Hue Tile -->
        <g transform="translate(62, 0)">
          <rect x="0" y="0" width="54" height="44" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.75" />
          <circle cx="27" cy="16" r="7" fill="#FF1744" opacity="0.2" />
          <circle cx="27" cy="16" r="4" fill="#FF1744" />
          <text x="27" y="34" class="font-sans" font-size="5.5" fill="#94a3b8" text-anchor="middle">Veloci Hue</text>
        </g>

        <!-- Tile 3: AI Playground Tile -->
        <g transform="translate(124, 0)">
          <rect x="0" y="0" width="54" height="44" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.75" />
          <circle cx="27" cy="16" r="7" fill="#7F52FF" opacity="0.2" />
          <text x="27" y="19" class="font-mono" font-size="6" font-weight="700" fill="#c4b5fd" text-anchor="middle">AI</text>
          <text x="27" y="34" class="font-sans" font-size="5.5" fill="#94a3b8" text-anchor="middle">Playground</text>
        </g>
      </g>
    </g>

    <!-- 2. Foreground Device: Mobile Smartphone (Jetpack Compose & AI) -->
    <!-- Positioned at x=0 to 86, height=164, slightly overlapping TV left bezel only -->
    <g transform="translate(0, 48)" filter="url(#mobileLayerShadow)">
      <!-- Phone Outer Chassis -->
      <rect x="0" y="0" width="86" height="162" rx="16" class="mobile-frame" />
      <!-- Phone Screen Canvas -->
      <rect x="3.5" y="3.5" width="79" height="155" rx="13" class="mobile-screen" />

      <!-- Top Camera Notch -->
      <rect x="32" y="6" width="22" height="3" rx="1.5" fill="#64748b" opacity="0.4" />
      
      <!-- Status Bar Telemetry -->
      <g transform="translate(8, 13)">
        <text x="0" y="3" class="font-mono" font-size="5" font-weight="700" fill="#64748b">9:41</text>
        <circle cx="61" cy="1" r="1.5" fill="#3DDC84" />
        <rect x="64" y="-1" width="3.5" height="3.5" rx="1" fill="#64748b" />
      </g>

      <!-- Material You Dynamic Tonal Swatches -->
      <g transform="translate(8, 20)">
        <rect x="0" y="0" width="11" height="4" rx="2" fill="#7F52FF" />
        <rect x="13" y="0" width="11" height="4" rx="2" fill="#00E5FF" />
        <rect x="26" y="0" width="11" height="4" rx="2" fill="#3DDC84" />
        <rect x="39" y="0" width="11" height="4" rx="2" fill="#F59E0B" />
      </g>

      <!-- Card 1: On-Device AI Streaming Card -->
      <g transform="translate(6, 29)">
        <rect x="0" y="0" width="74" height="42" rx="5" fill="rgba(127, 82, 255, 0.1)" stroke="#7F52FF" stroke-width="0.75" />
        <rect x="5" y="4" width="38" height="8" rx="2.5" fill="#7F52FF" />
        <text x="24" y="10" class="font-mono" font-size="4" font-weight="700" fill="#ffffff" text-anchor="middle">ON-DEVICE AI</text>
        <text x="69" y="10" class="font-mono" font-size="4.5" font-weight="700" fill="#00E676" text-anchor="end">42 t/s</text>
        <!-- Streaming Waveform -->
        <path d="M 5 24 Q 12 16 19 24 T 33 24 T 47 24 T 61 24" fill="none" stroke="url(#mobileWaveGrad)" stroke-width="1.25" />
        <text x="5" y="36" class="font-mono" font-size="4" fill="#64748b">llama.cpp · Vulkan</text>
      </g>

      <!-- Card 2: Adaptive Compose UI Card -->
      <g transform="translate(6, 76)">
        <rect x="0" y="0" width="74" height="42" rx="5" class="mobile-sub-card" />
        <rect x="5" y="6" width="30" height="4.5" rx="2" fill="#4285F4" />
        <rect x="5" y="14" width="46" height="2.5" rx="1.2" fill="#94a3b8" opacity="0.4" />
        <rect x="5" y="19" width="34" height="2.5" rx="1.2" fill="#94a3b8" opacity="0.4" />
        <!-- KMP State Pill -->
        <rect x="5" y="27" width="34" height="8" rx="4" fill="rgba(61, 220, 132, 0.18)" stroke="#3DDC84" stroke-width="0.5" />
        <text x="22" y="32.8" class="font-sans" font-size="4" font-weight="700" fill="#00C853" text-anchor="middle">KMP SYNC</text>
      </g>

      <!-- Bottom Navigation Dock -->
      <g transform="translate(6, 125)">
        <rect x="0" y="0" width="74" height="16" rx="8" fill="rgba(15, 23, 42, 0.06)" />
        <circle cx="20" cy="8" r="3.5" fill="#7F52FF" />
        <circle cx="37" cy="8" r="2.5" fill="#94a3b8" opacity="0.5" />
        <circle cx="54" cy="8" r="2.5" fill="#94a3b8" opacity="0.5" />
      </g>
    </g>

    <!-- 3. Dynamic Connecting Vector Arcs & Floating Tech Nodes -->
    <g>
      <!-- KMP State Sync Arc from Mobile to TV -->
      <path d="M 76 130 C 92 145 102 125 96 112" fill="none" stroke="url(#kmpBridgeGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
      <circle cx="76" cy="130" r="2.5" fill="#3DDC84" />
      <circle cx="96" cy="112" r="2.5" fill="#00E5FF" />

      <!-- Top Right Floating Tech Node: COMPOSE TV -->
      <g transform="translate(216, 0)">
        <rect x="0" y="0" width="76" height="18" rx="9" fill="rgba(66, 133, 244, 0.12)" stroke="#4285F4" stroke-width="0.75" />
        <circle cx="8" cy="9" r="2.5" fill="#4285F4" />
        <text x="14" y="12.2" class="font-mono" font-size="6" font-weight="700" fill="#4285F4">COMPOSE TV</text>
      </g>

      <!-- Bottom Right Floating Tech Node: ADAPTIVE UI -->
      <g transform="translate(212, 178)">
        <rect x="0" y="0" width="78" height="18" rx="9" fill="rgba(61, 220, 132, 0.12)" stroke="#3DDC84" stroke-width="0.75" />
        <circle cx="8" cy="9" r="2.5" fill="#3DDC84" />
        <text x="14" y="12.2" class="font-mono" font-size="6" font-weight="700" fill="#00C853">ADAPTIVE UI</text>
      </g>
    </g>
  </g>
</svg>
