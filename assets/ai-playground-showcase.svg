<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Blurs and Gradients -->
    <filter id="glow-ai" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="aiTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#E040FB" />
    </linearGradient>

    <!-- Diffusion Canvas Gradient -->
    <linearGradient id="diffusionArtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="30%" stop-color="#1e1b4b" />
      <stop offset="65%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="tokenStreamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Drop Shadow for the Card -->
    <filter id="shadow-ai" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.08" flood-color="#000" />
    </filter>

    <!-- Clip Path for Diffusion Artwork -->
    <clipPath id="diffusionArtClip">
      <rect x="0" y="0" width="86" height="54" rx="6" />
    </clipPath>

    <!-- Clip Path for Workstation Window -->
    <clipPath id="aiWindowClip">
      <rect x="0" y="0" width="232" height="164" rx="14" />
    </clipPath>
  </defs>

  <style>
    /* Global Styles */
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    /* Light Theme (Default) */
    .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; rx: 16px; }
    .text-title { font-weight: 800; font-size: 26px; fill: url(#aiTitleGrad); }
    .text-category { fill: #F88909; font-weight: 700; font-size: 11px; letter-spacing: 2px; }
    .text-desc { fill: #4b5563; font-size: 13.5px; }
    .station-frame { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 14px; }
    .panel-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; }
    .panel-accent { fill: #f0f3f6; }
    .code-text { fill: #24292f; }
    .code-muted { fill: #6e7781; }
    
    /* Badges Light */
    .store-badge { fill: #24292f; rx: 6px; }
    .store-text { fill: #ffffff; font-weight: 700; font-size: 11px; }
    .tech-badge { fill: #f2f4f7; stroke: #d0d7de; stroke-width: 1; rx: 6px; }
    .tech-text { fill: #24292f; font-weight: 600; font-size: 10.5px; }

    /* Dark Theme Overrides */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .text-category { fill: #FFA726; }
      .text-desc { fill: #8b949e; }
      .station-frame { fill: #161b22; stroke: #30363d; }
      .panel-bg { fill: #0d1117; stroke: #30363d; }
      .panel-accent { fill: #161b22; }
      .code-text { fill: #f0f6fc; }
      .code-muted { fill: #8b949e; }
      .store-badge { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .store-text { fill: #f0f6fc; }
      .tech-badge { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .tech-text { fill: #c9d1d9; }
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="196" rx="16" class="card-bg" filter="url(#shadow-ai)" />

  <!-- Left Content Column -->
  <g transform="translate(42, 0)">
    <!-- Category -->
    <text x="0" y="44" class="font-sans text-category">FEATURED PROJECT · ON-DEVICE AI</text>
    
    <!-- Title -->
    <text x="0" y="80" class="font-sans text-title">AI Playground</text>
    
    <!-- Description with generous line-height and comfortable margins -->
    <text x="0" y="114" class="font-sans text-desc">Offline on-device LLM &amp; diffusion image synthesis for Android &amp; iOS.</text>
    <text x="0" y="136" class="font-sans text-desc">Runs llama.cpp v0.7.0, LiteRT multi-graph &amp; Apple MLX Metal.</text>

    <!-- Badges Row (Total width 443px, leaves 85px before x=528) -->
    <g transform="translate(0, 166)">
      <!-- Google Play Badge -->
      <g>
        <rect x="0" y="-12" width="105" height="22" rx="6" class="store-badge" />
        <text x="52.5" y="3" class="font-sans store-text" text-anchor="middle">▶ Google Play</text>
      </g>
      <!-- KMP × CMP Badge -->
      <g transform="translate(113, 0)">
        <rect x="0" y="-12" width="92" height="22" rx="6" class="tech-badge" />
        <text x="46" y="3" class="font-sans tech-text" text-anchor="middle">⚡ KMP × CMP</text>
      </g>
      <!-- Dual Engine Badge -->
      <g transform="translate(213, 0)">
        <rect x="0" y="-12" width="132" height="22" rx="6" class="tech-badge" />
        <text x="66" y="3" class="font-sans tech-text" text-anchor="middle">🧠 llama.cpp &amp; LiteRT</text>
      </g>
      <!-- MLX Badge -->
      <g transform="translate(353, 0)">
        <rect x="0" y="-12" width="90" height="22" rx="6" class="tech-badge" />
        <text x="45" y="3" class="font-sans tech-text" text-anchor="middle">🍏 MLX Metal</text>
      </g>
    </g>
  </g>

  <!-- Right Content: Sleek On-Device AI Dual-Engine Workstation -->
  <g transform="translate(528, 18)" clip-path="url(#aiWindowClip)">
    <!-- Container Bezel -->
    <rect x="0" y="0" width="232" height="164" class="station-frame" />
    
    <!-- Subtle Neural Mesh Background -->
    <g stroke="#7F52FF" stroke-width="0.5" opacity="0.22">
      <line x1="20" y1="20" x2="70" y2="35" />
      <line x1="70" y1="35" x2="140" y2="15" />
      <line x1="140" y1="15" x2="210" y2="40" />
      <line x1="70" y1="35" x2="100" y2="80" />
      <line x1="140" y1="15" x2="170" y2="75" />
      <line x1="170" y1="75" x2="215" y2="120" />
      <circle cx="20" cy="20" r="1.5" fill="#00E5FF" />
      <circle cx="70" cy="35" r="2" fill="#7F52FF" />
      <circle cx="140" cy="15" r="2" fill="#00E5FF" />
      <circle cx="210" cy="40" r="1.5" fill="#3DDC84" />
      <circle cx="100" cy="80" r="2" fill="#E040FB" />
      <circle cx="170" cy="75" r="2" fill="#00E676" />
      <circle cx="215" cy="120" r="2" fill="#00E5FF" />
    </g>

    <!-- 1. LLM Generation Panel (Top Module, width 214, x=9) -->
    <g transform="translate(9, 9)">
      <rect x="0" y="0" width="214" height="66" rx="8" class="panel-bg" />
      
      <!-- Panel Header Bar with Model Dropdown & Telemetry -->
      <g transform="translate(8, 7)">
        <!-- Real App Model Selector Dropdown Pill -->
        <rect x="0" y="0" width="102" height="15" rx="4" fill="rgba(0, 176, 255, 0.12)" stroke="#00B0FF" stroke-width="0.5" />
        <circle cx="6" cy="7.5" r="2" fill="#00E5FF" />
        <text x="12" y="10.5" class="font-mono" font-size="6" font-weight="700" fill="#00B0FF">SmolLM2 360M (Q8) ▼</text>
        
        <!-- Live Velocity Badge (Positioned at right with safe margin) -->
        <g transform="translate(142, 0)">
          <rect x="0" y="0" width="56" height="15" rx="4" fill="rgba(0, 230, 118, 0.12)" stroke="#00E676" stroke-width="0.5" />
          <circle cx="6" cy="7.5" r="2" fill="#00E676" />
          <text x="12" y="10.5" class="font-mono" font-size="6" font-weight="700" fill="#00C853">42.8 t/s</text>
        </g>
      </g>

      <!-- Active Prompt & Reasoning Stream -->
      <g transform="translate(8, 27)">
        <!-- User Prompt Line -->
        <rect x="0" y="0" width="198" height="13" rx="3.5" class="panel-accent" />
        <circle cx="7" cy="6.5" r="2" fill="#7F52FF" />
        <text x="14" y="9" class="font-mono code-muted" font-size="6">prompt: "Synthesize local reactive state"</text>

        <!-- Streamed LLM Token Output with <think> tag -->
        <g transform="translate(0, 16)">
          <!-- Thinking chip -->
          <rect x="0" y="0" width="40" height="13" rx="3" fill="rgba(127, 82, 255, 0.15)" />
          <text x="4" y="9" class="font-mono" font-size="6" font-weight="700" fill="#7F52FF">&lt;think&gt;</text>
          <!-- Streaming Tokens with Gradient Accent -->
          <text x="45" y="9.5" class="font-mono code-text" font-size="6" font-weight="600">val localFlow = engine.streamTokens()</text>
        </g>
      </g>
    </g>

    <!-- 2. On-Device Diffusion Panel (Bottom Module, width 214, x=9) -->
    <g transform="translate(9, 81)">
      <rect x="0" y="0" width="214" height="73" rx="8" class="panel-bg" />
      
      <!-- Left: Synthesized Artwork Canvas (86 × 54) -->
      <g transform="translate(8, 9)" clip-path="url(#diffusionArtClip)">
        <rect x="0" y="0" width="86" height="54" fill="url(#diffusionArtGrad)" />
        
        <!-- Synthesized Celestial Sun/Aura -->
        <circle cx="62" cy="16" r="11" fill="#FFD740" opacity="0.9" filter="url(#glow-ai)" />
        
        <!-- Neural Hills / Horizons -->
        <path d="M 0 36 Q 26 25 52 32 T 86 28 L 86 54 L 0 54 Z" fill="#311042" opacity="0.8" />
        <path d="M 0 42 Q 30 34 60 40 T 86 38 L 86 54 L 0 54 Z" fill="#110726" opacity="0.95" />
        
        <!-- Stylized Digital Bonsai Tree Silhouette -->
        <path d="M 34 46 C 34 40, 30 36, 26 32 C 22 28, 20 22, 24 18 C 28 14, 36 16, 38 22 C 40 18, 48 18, 50 24 C 52 30, 44 36, 40 40 L 40 46 Z" fill="#00E5FF" opacity="0.85" />
        <circle cx="24" cy="18" r="3.2" fill="#E040FB" opacity="0.85" />
        <circle cx="38" cy="20" r="4.2" fill="#69F0AE" opacity="0.85" />
        <circle cx="49" cy="23" r="3.2" fill="#FFD740" opacity="0.85" />
        
        <!-- Step Overlay Badge -->
        <rect x="4" y="4" width="54" height="11" rx="3" fill="rgba(0, 0, 0, 0.65)" />
        <text x="7" y="11.5" class="font-mono" font-size="5.5" font-weight="700" fill="#69F0AE">Step 4/4 · FLUX</text>
      </g>

      <!-- Right: Diffusion Model Specs & Hardware Badges (Safe width 108, ends at 208 < 214) -->
      <g transform="translate(102, 9)">
        <text x="0" y="12" class="font-sans" font-size="9" font-weight="800" fill="url(#tokenStreamGrad)">Bonsai Image 4B</text>
        <text x="0" y="23" class="font-mono code-muted" font-size="6">1.58-bit Ternary DiT</text>
        
        <!-- Engine Accents Pill -->
        <g transform="translate(0, 29)">
          <rect x="0" y="0" width="98" height="13" rx="3" fill="rgba(127, 82, 255, 0.12)" stroke="#7F52FF" stroke-width="0.5" />
          <circle cx="6" cy="6.5" r="1.5" fill="#7F52FF" />
          <text x="12" y="9.2" class="font-mono" font-size="5.8" font-weight="700" fill="#7F52FF">LiteRT · Apple MLX</text>
        </g>
        
        <!-- Privacy Telemetry Badge -->
        <g transform="translate(0, 46)">
          <text x="0" y="8" class="font-mono code-muted" font-size="5.8">🔒 100% On-Device · Zero Cloud</text>
        </g>
      </g>
    </g>
  </g>
</svg>
