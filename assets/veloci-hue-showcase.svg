<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Blurs and Gradients -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FFD740" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#7F52FF" />
    </linearGradient>

    <!-- Drop Shadow for the Card -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" flood-color="#000" />
    </filter>
  </defs>

  <style>
    /* Global Styles */
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    /* Light Theme (Default) */
    .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; rx: 16px; }
    .text-title { font-weight: 800; font-size: 26px; fill: url(#textGrad); }
    .text-category { fill: #f88909; font-weight: 700; font-size: 11px; letter-spacing: 2px; }
    .text-desc { fill: #57606a; font-size: 13.5px; }
    .game-bg { fill: #eaeef2; rx: 12px; }
    
    /* Play Buttons Light */
    .store-badge { fill: #24292f; rx: 6px; }
    .store-text { fill: #ffffff; font-weight: 700; font-size: 11px; }

    /* Dark Theme Overrides */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .text-category { fill: #ffb74d; }
      .text-desc { fill: #8b949e; }
      .game-bg { fill: #161b22; }
      .store-badge { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .store-text { fill: #f0f6fc; }
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="196" class="card-bg" filter="url(#shadow)" />

  <!-- Left Content Column -->
  <g transform="translate(45, 0)">
    <!-- Category -->
    <text x="0" y="46" class="font-sans text-category">FEATURED SIDE PROJECT</text>
    
    <!-- Title -->
    <text x="0" y="84" class="font-sans text-title">Veloci Hue</text>
    
    <!-- Description -->
    <text x="0" y="118" class="font-sans text-desc">A fast-paced, cross-platform color matching game built using</text>
    <text x="0" y="138" class="font-sans text-desc">Kotlin Multiplatform &amp; Compose Multiplatform for Android &amp; iOS.</text>

    <!-- Store Badges -->
    <g transform="translate(0, 166)">
      <!-- Google Play Badge -->
      <g>
        <rect x="0" y="-12" width="110" height="22" class="store-badge" />
        <text x="55" y="3" class="font-sans store-text" text-anchor="middle">▶ Google Play</text>
      </g>
      <!-- App Store Badge -->
      <g transform="translate(120, 0)">
        <rect x="0" y="-12" width="125" height="22" class="store-badge" />
        <text x="62.5" y="3" class="font-sans store-text" text-anchor="middle">🍏 App Store (Soon)</text>
      </g>
    </g>
  </g>

  <!-- Right Content: Playful visual representation of Veloci Hue -->
  <g transform="translate(540, 20)">
    <!-- Simulated Screen Container -->
    <rect x="0" y="0" width="215" height="160" class="game-bg" />
    
    <!-- Speed/Hue Trails (Glow Effect) -->
    <!-- Violet Trail -->
    <path d="M 20 80 Q 70 30 120 80 T 200 70" fill="none" stroke="#7F52FF" stroke-width="12" stroke-linecap="round" opacity="0.6" filter="url(#glow)" />
    <!-- Yellow/Orange Trail -->
    <path d="M 15 95 Q 80 130 135 70 T 205 100" fill="none" stroke="#FFD740" stroke-width="8" stroke-linecap="round" opacity="0.5" filter="url(#glow)" />
    <!-- Cyan/Mint Trail -->
    <path d="M 30 65 Q 90 100 110 50 T 190 110" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" opacity="0.4" filter="url(#glow)" />
    
    <!-- Interactive Game Orb (Gradient) -->
    <circle cx="120" cy="80" r="16" fill="url(#btnGrad)" filter="url(#glow)" />
    <circle cx="116" cy="76" r="4" fill="#ffffff" opacity="0.6" />
    
    <!-- Monospace Overlay (Code + Game Sync Theme) -->
    <text x="14" y="26" font-size="10" fill="#888" opacity="0.4" class="font-mono">val speed = 250.fps</text>
    <text x="14" y="144" font-size="10" fill="#888" opacity="0.4" class="font-mono">hue.colorflow()</text>
  </g>
</svg>
