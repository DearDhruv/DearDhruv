<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Blurs and Gradients -->
    <filter id="glow-vh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FFD740" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>

    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>

    <linearGradient id="gateGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="gateGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#69F0AE" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow for the Card -->
    <filter id="shadow-vh" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" flood-color="#000" />
    </filter>

    <!-- Clip Path for Arcade Screen -->
    <clipPath id="vhGameClip">
      <rect x="0" y="0" width="232" height="164" rx="14" />
    </clipPath>
  </defs>

  <style>
    /* Global Styles */
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    /* Light Theme (Default) */
    .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; rx: 16px; }
    .text-title { font-weight: 800; font-size: 26px; fill: url(#textGrad); }
    .text-category { fill: #f88909; font-weight: 700; font-size: 11px; letter-spacing: 2px; }
    .text-desc { fill: #57606a; font-size: 13.5px; }
    .game-bg { fill: #f6f8fa; rx: 14px; }
    .game-code { fill: #57606a; font-size: 9.5px; font-weight: 600; opacity: 0.9; }
    .ctrl-pill-bg { fill: rgba(127, 82, 255, 0.12); stroke: rgba(127, 82, 255, 0.3); stroke-width: 0.75; }
    .ctrl-icon { fill: #7F52FF; }
    
    /* Badges Light */
    .store-badge { fill: #24292f; rx: 6px; }
    .store-text { fill: #ffffff; font-weight: 700; font-size: 11px; }
    .tech-badge { fill: #f2f4f7; stroke: #d0d7de; stroke-width: 1; rx: 6px; }
    .tech-text { fill: #24292f; font-weight: 600; font-size: 10.5px; }

    /* Dark Theme Overrides */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .text-category { fill: #ffb74d; }
      .text-desc { fill: #8b949e; }
      .game-bg { fill: #161b22; }
      .game-code { fill: #8b949e; opacity: 0.9; }
      .ctrl-pill-bg { fill: rgba(167, 139, 250, 0.2); stroke: rgba(167, 139, 250, 0.4); }
      .ctrl-icon { fill: #c4b5fd; }
      .store-badge { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .store-text { fill: #f0f6fc; }
      .tech-badge { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .tech-text { fill: #c9d1d9; }
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="196" class="card-bg" filter="url(#shadow-vh)" />

  <!-- Left Content Column -->
  <g transform="translate(42, 0)">
    <!-- Category -->
    <text x="0" y="44" class="font-sans text-category">FEATURED PROJECT · KMP ARCADE</text>
    
    <!-- Title -->
    <text x="0" y="80" class="font-sans text-title">Veloci Hue</text>
    
    <!-- Description with generous line-height -->
    <text x="0" y="114" class="font-sans text-desc">Fast-paced arcade color reflex game built for Mobile &amp; Android TV.</text>
    <text x="0" y="136" class="font-sans text-desc">KMP &amp; Compose Multiplatform with cloud sync &amp; D-pad Leanback controls.</text>

    <!-- Badges Row -->
    <g transform="translate(0, 166)">
      <!-- Google Play Badge -->
      <g>
        <rect x="0" y="-12" width="105" height="22" class="store-badge" />
        <text x="52.5" y="3" class="font-sans store-text" text-anchor="middle">▶ Google Play</text>
      </g>
      <!-- Android TV Badge -->
      <g transform="translate(113, 0)">
        <rect x="0" y="-12" width="102" height="22" class="tech-badge" />
        <text x="51" y="3" class="font-sans tech-text" text-anchor="middle">📺 Android TV</text>
      </g>
      <!-- KMP × CMP Badge -->
      <g transform="translate(223, 0)">
        <rect x="0" y="-12" width="92" height="22" class="tech-badge" />
        <text x="46" y="3" class="font-sans tech-text" text-anchor="middle">⚡ KMP × CMP</text>
      </g>
      <!-- Cloud Sync v5 Badge -->
      <g transform="translate(323, 0)">
        <rect x="0" y="-12" width="104" height="22" class="tech-badge" />
        <text x="52" y="3" class="font-sans tech-text" text-anchor="middle">☁️ Cloud Sync v5</text>
      </g>
    </g>
  </g>

  <!-- Right Content: Playful visual representation of Veloci Hue -->
  <g transform="translate(528, 18)" clip-path="url(#vhGameClip)">
    <!-- Simulated Screen Container -->
    <rect x="0" y="0" width="232" height="164" class="game-bg" />
    
    <!-- Speed/Hue Trails (Glow Effect) -->
    <!-- Violet Trail -->
    <path d="M 20 86 Q 75 35 130 86 T 215 75" fill="none" stroke="#7F52FF" stroke-width="12" stroke-linecap="round" opacity="0.6" filter="url(#glow-vh)" />
    <!-- Yellow/Orange Trail -->
    <path d="M 15 100 Q 85 136 145 76 T 220 106" fill="none" stroke="#FFD740" stroke-width="8" stroke-linecap="round" opacity="0.5" filter="url(#glow-vh)" />
    <!-- Cyan/Mint Trail -->
    <path d="M 30 70 Q 95 106 120 56 T 205 116" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" opacity="0.45" filter="url(#glow-vh)" />
    
    <!-- Dynamic Color Gates (Obstacles) -->
    <rect x="62" y="16" width="6" height="42" rx="3" fill="url(#gateGrad1)" />
    <rect x="62" y="106" width="6" height="42" rx="3" fill="url(#gateGrad1)" />
    <rect x="168" y="16" width="6" height="48" rx="3" fill="url(#gateGrad2)" />
    <rect x="168" y="112" width="6" height="36" rx="3" fill="url(#gateGrad2)" />

    <!-- Interactive Game Orb (Gradient) -->
    <circle cx="126" cy="84" r="17" fill="url(#orbGrad)" filter="url(#glow-vh)" />
    <circle cx="122" cy="80" r="4.5" fill="#ffffff" opacity="0.8" />
    
    <!-- TV D-pad Controller Affordance Indicator -->
    <g transform="translate(186, 16)">
      <rect x="0" y="0" width="34" height="22" rx="6" class="ctrl-pill-bg" />
      <!-- Mini D-pad Cross -->
      <g transform="translate(10, 4)">
        <rect x="5" y="0" width="4" height="14" rx="1.5" class="ctrl-icon" />
        <rect x="0" y="5" width="14" height="4" rx="1.5" class="ctrl-icon" />
        <circle cx="7" cy="7" r="1.5" fill="#ffffff" />
      </g>
    </g>

    <!-- Monospace Overlay (Code + Game Sync Theme) -->
    <text x="14" y="26" class="font-mono game-code">val speed = 120.fps</text>
    <text x="14" y="148" class="font-mono game-code">leanback.dpad() · sync:v5</text>
  </g>
</svg>
