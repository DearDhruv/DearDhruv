<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Blurs and Gradients -->
    <filter id="glow-mp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#C711E1" />
    </linearGradient>

    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="40%" stop-color="#243B55" />
      <stop offset="70%" stop-color="#7F52FF" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>

    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3DDC84" />
    </linearGradient>

    <!-- Drop Shadow for the Card -->
    <filter id="shadow-mp" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" flood-color="#000" />
    </filter>
  </defs>

  <style>
    /* Global Styles */
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    /* Light Theme (Default) */
    .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; rx: 16px; }
    .text-title { font-weight: 800; font-size: 26px; fill: url(#aiGrad); }
    .text-category { fill: #F88909; font-weight: 700; font-size: 11px; letter-spacing: 2px; }
    .text-desc { fill: #57606a; font-size: 13.5px; }
    .display-bg { fill: #f6f8fa; rx: 14px; }
    
    /* Device Mockup Light */
    .device-body { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
    .device-screen { fill: #f6f8fa; stroke: #e1e4e8; stroke-width: 1; }
    
    /* Badges Light */
    .store-badge { fill: #24292f; rx: 6px; }
    .store-text { fill: #ffffff; font-weight: 700; font-size: 11px; }
    .tech-badge { fill: #f2f4f7; stroke: #d0d7de; stroke-width: 1; rx: 6px; }
    .tech-text { fill: #24292f; font-weight: 600; font-size: 10.5px; }

    /* Dark Theme Overrides */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .text-category { fill: #FFA726; }
      .text-desc { fill: #8b949e; }
      .display-bg { fill: #161b22; }
      .device-body { fill: #21262d; stroke: #30363d; }
      .device-screen { fill: #0d1117; stroke: #21262d; }
      .store-badge { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .store-text { fill: #f0f6fc; }
      .tech-badge { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .tech-text { fill: #c9d1d9; }
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="196" class="card-bg" filter="url(#shadow-mp)" />

  <!-- Left Content Column -->
  <g transform="translate(42, 0)">
    <!-- Category -->
    <text x="0" y="44" class="font-sans text-category">FEATURED PROJECT · ON-DEVICE AI</text>
    
    <!-- Title -->
    <text x="0" y="80" class="font-sans text-title">Model Playground</text>
    
    <!-- Description with generous line-height -->
    <text x="0" y="114" class="font-sans text-desc">Offline on-device LLM &amp; diffusion image synthesis for Android &amp; iOS.</text>
    <text x="0" y="136" class="font-sans text-desc">Powered by llama.cpp v0.7.0, LiteRT multi-graph &amp; Apple MLX Metal.</text>

    <!-- Badges Row -->
    <g transform="translate(0, 166)">
      <!-- Google Play Badge -->
      <g>
        <rect x="0" y="-12" width="105" height="22" class="store-badge" />
        <text x="52.5" y="3" class="font-sans store-text" text-anchor="middle">▶ Google Play</text>
      </g>
      <!-- KMP × CMP Badge -->
      <g transform="translate(113, 0)">
        <rect x="0" y="-12" width="92" height="22" class="tech-badge" />
        <text x="46" y="3" class="font-sans tech-text" text-anchor="middle">⚡ KMP × CMP</text>
      </g>
      <!-- Dual Engine Badge -->
      <g transform="translate(213, 0)">
        <rect x="0" y="-12" width="140" height="22" class="tech-badge" />
        <text x="70" y="3" class="font-sans tech-text" text-anchor="middle">🧠 llama.cpp &amp; LiteRT</text>
      </g>
      <!-- MLX Badge -->
      <g transform="translate(361, 0)">
        <rect x="0" y="-12" width="90" height="22" class="tech-badge" />
        <text x="45" y="3" class="font-sans tech-text" text-anchor="middle">🍏 MLX Metal</text>
      </g>
    </g>
  </g>

  <!-- Right Content: Dual LLM + Diffusion Studio Mockup -->
  <g transform="translate(528, 18)">
    <!-- Canvas Container -->
    <rect x="0" y="0" width="232" height="164" class="display-bg" />
    
    <!-- Constellation / Tensor Lines Background -->
    <g stroke="#7F52FF" stroke-width="0.75" opacity="0.3">
      <line x1="20" y1="35" x2="65" y2="25" />
      <line x1="65" y1="25" x2="110" y2="45" />
      <line x1="20" y1="35" x2="35" y2="90" />
      <line x1="35" y1="90" x2="80" y2="120" />
      <line x1="180" y1="30" x2="215" y2="60" />
      <line x1="195" y1="110" x2="220" y2="140" />
    </g>
    <g fill="#00E5FF" opacity="0.6">
      <circle cx="20" cy="35" r="2.5" filter="url(#glow-mp)" />
      <circle cx="65" cy="25" r="3" />
      <circle cx="110" cy="45" r="2" />
      <circle cx="35" cy="90" r="2.5" />
      <circle cx="80" cy="120" r="3" fill="#C711E1" />
      <circle cx="215" cy="60" r="2.5" fill="#3DDC84" />
      <circle cx="195" cy="110" r="2" />
    </g>

    <!-- Foreground Smartphone Device Frame -->
    <g transform="translate(56, 8)">
      <!-- Phone Shadow/Body -->
      <rect x="0" y="0" width="118" height="148" rx="14" class="device-body" />
      <!-- Phone Screen -->
      <rect x="4" y="4" width="110" height="140" rx="11" class="device-screen" />
      
      <!-- Top Status/Camera Notch -->
      <rect x="45" y="7" width="20" height="3" rx="1.5" fill="#888888" opacity="0.4" />

      <!-- UI Element 1: Chat Prompt Bubble -->
      <rect x="12" y="15" width="86" height="15" rx="5" fill="#00B0FF" opacity="0.18" />
      <rect x="18" y="20" width="52" height="2.5" rx="1.25" fill="#00B0FF" />
      <rect x="18" y="24" width="30" height="2" rx="1" fill="#00B0FF" opacity="0.6" />

      <!-- UI Element 2: Generated Image Canvas (Diffusion Preview) -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="86" height="52" rx="6" fill="url(#artGrad)" />
        <!-- Nebula / Sun Circle -->
        <circle cx="60" cy="22" r="10" fill="#FFD740" opacity="0.8" filter="url(#glow-mp)" />
        <!-- Horizon Hills -->
        <path d="M 0 42 Q 22 28 44 38 T 86 34 L 86 52 L 0 52 Z" fill="#0f172a" opacity="0.85" />
        <path d="M 15 45 Q 40 33 65 42 T 86 40 L 86 52 L 15 52 Z" fill="#1e1b4b" opacity="0.6" />
        <!-- Sparkle Accent -->
        <path d="M 18 16 L 20 12 L 22 16 L 26 18 L 22 20 L 20 24 L 18 20 L 14 18 Z" fill="#ffffff" opacity="0.85" />
      </g>

      <!-- UI Element 3: Dual Engine Speed Badge -->
      <g transform="translate(12, 92)">
        <rect x="0" y="0" width="86" height="16" rx="4" fill="#7F52FF" opacity="0.15" />
        <circle cx="8" cy="8" r="3" fill="#3DDC84" />
        <text x="16" y="11" class="font-mono" font-size="7.5" font-weight="700" fill="#7F52FF">Bonsai 4B · 32 t/s</text>
      </g>

      <!-- UI Element 4: Bottom Input Pill with Token Stream -->
      <g transform="translate(10, 114)">
        <rect x="0" y="0" width="90" height="20" rx="10" fill="#21262d" opacity="0.1" />
        <rect x="2" y="2" width="86" height="16" rx="8" class="device-body" stroke-width="0.5" />
        <circle cx="10" cy="10" r="3" fill="url(#tokenGrad)" />
        <rect x="18" y="8" width="46" height="2" rx="1" fill="#7F52FF" opacity="0.7" />
        <rect x="18" y="12" width="24" height="2" rx="1" fill="#00E5FF" opacity="0.5" />
        <circle cx="78" cy="10" r="4" fill="url(#aiGrad)" />
      </g>
    </g>
  </g>
</svg>
